      <text x="114" y="726" font-size="13" font-weight="600" fill="#4b5a70">Yerel model çağrısı kurum ağında kaldı.</text>
      <text x="1112" y="726" text-anchor="end" font-size="12" font-weight="700" fill="#16845d">Ollama · yerel</text>
