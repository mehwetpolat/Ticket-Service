    <rect x="620" y="352" width="492" height="350" rx="14" fill="#fbfcfe" stroke="#e3e8ef"/>
    <text x="640" y="384" class="card-title">Analiz sonucu</text>
    <text x="640" y="418" class="label">BAŞLIK</text>
    <text x="640" y="438" class="value">VPN bağlantısı açılmıyor</text>
    <text x="640" y="468" class="label">KATEGORİ</text>
    <text x="640" y="488" class="value">Ağ / VPN</text>
    <text x="640" y="518" class="label">ÖNCELİK</text>
    <rect x="640" y="526" width="66" height="22" rx="11" fill="#fff1e6"/>
    <text x="673" y="541" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Yüksek</text>
    <text x="640" y="566" class="label">TALEP EDEN</text>
    <text x="640" y="586" class="value">Ayşe Yılmaz</text>
    <text x="640" y="616" class="label">CİHAZ</text>
    <text x="640" y="636" class="value">FIN-LT-042</text>
    <text x="640" y="666" class="label">HEDEF</text>
    <rect x="640" y="674" width="74" height="22" rx="11" fill="#eef2ff"/>
    <text x="677" y="689" text-anchor="middle" font-size="11" font-weight="700" fill="#3449cc">Jira · IT</text>

    <g>
      <path d="M80 722 L84 712 H100 L104 722 V728 H80 Z" fill="none" stroke="#16845d" stroke-width="1.8" stroke-linejoin="round"/>
