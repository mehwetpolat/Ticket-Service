    <text x="56" y="140" class="title">TickeTask talebi arka planda işler</text>
    <text x="56" y="170" class="subtitle">TickeTask kutuyu kontrol eder; filtre ve yerel model talebi yapılandırılmış bir ticket taslağına dönüştürür.</text>

