<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Örnek senaryo 2: TickeTask e-postayı arka planda işler</title>
  <desc id="desc">TickeTask e-postayı alır, izinli gönderen ve otomatik yanıt filtrelerinden geçirir, yerel modelle analiz eder, cihaz ve iş etkisini çıkarır ve Jira ticket taslağını oluşturur.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fd"/>
      <stop offset="1" stop-color="#edf2fa"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f8cff"/>
      <stop offset="1" stop-color="#445be7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#172131" flood-opacity="0.12"/>
    </filter>
    <style>
      .font { font-family: 'Segoe UI', Arial, Helvetica, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #69758a; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: -1px; fill: #172131; }
      .subtitle { font-size: 18px; fill: #69758a; }
      .window-title { font-size: 15px; font-weight: 700; fill: #33425a; }
      .card-title { font-size: 17px; font-weight: 700; fill: #172131; }
      .row { font-size: 15px; font-weight: 600; fill: #33425a; }
      .time { font-size: 12px; fill: #8a96a9; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: 0.7px; fill: #8a96a9; }
      .value { font-size: 15px; font-weight: 600; fill: #33425a; }
      .small { font-size: 12px; fill: #8a96a9; }
      .flow { font-size: 13px; font-weight: 700; fill: #44516a; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <circle cx="1140" cy="80" r="210" fill="#445be7" opacity="0.055"/>
  <path d="M0 700 C260 660 420 760 680 710 S1000 650 1200 710" fill="none" stroke="#445be7" stroke-opacity="0.05" stroke-width="2"/>

  <g class="font">
    <rect x="56" y="38" width="40" height="40" rx="11" fill="url(#accent)"/>
    <path d="M69 59 L76 49 L83 59" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M69 59 L76 69 L83 59" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <text x="108" y="64" font-size="22" font-weight="700" fill="#172131">TickeTask</text>
    <text x="109" y="80" font-size="10" font-weight="700" letter-spacing="1.6" fill="#8a96a9">IT SERVİS MASASI</text>

    <rect x="944" y="40" width="200" height="34" rx="17" fill="#ffffff" stroke="#dbe3ef"/>
