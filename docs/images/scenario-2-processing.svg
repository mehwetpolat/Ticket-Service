      <path d="M100 558 L103 561 L109 554" fill="none" stroke="#16845d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="126" y="564" class="row">Yerel model analizi tamamlandı</text>
      <text x="570" y="564" text-anchor="end" class="time">09:42:18</text>

      <circle cx="104" cy="604" r="9" fill="#e9f8f2" stroke="#bfe8d8"/>
      <path d="M100 604 L103 607 L109 600" fill="none" stroke="#16845d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="126" y="610" class="row">Cihaz ve iş etkisi çıkarıldı</text>
      <text x="570" y="610" text-anchor="end" class="time">09:42:18</text>

      <circle cx="104" cy="650" r="9" fill="#e8edff" stroke="#c9d4ff"/>
      <path d="M100 650 L103 653 L109 646" fill="none" stroke="#445be7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="126" y="656" class="row" fill="#3449cc">Jira'da IT-142 oluşturuldu</text>
      <text x="570" y="656" text-anchor="end" class="time">09:42:19</text>
